  <!-- CodeMirror Editor Lines -->
  <g transform="translate(294, 170)" font-family="'SF Mono','Cascadia Code','Fira Code',Menlo,monospace" font-size="12.5" line-height="1.6">
    <!-- Line numbers gutter -->
    <g fill="#475569" text-anchor="end">
