      <text x="24" y="330">16</text>
      <text x="24" y="352">17</text>
      <text x="24" y="374">18</text>
    </g>

    <!-- Code Content -->
    <g transform="translate(42, 0)">
      <text y="0"><tspan fill="#ec4899">#include</tspan> <tspan fill="#38bdf8">&lt;stdio.h&gt;</tspan></text>
      <text y="22"><tspan fill="#ec4899">#include</tspan> <tspan fill="#38bdf8">&quot;header.h&quot;</tspan></text>
      <text y="44"><tspan fill="#64748b">// Calculadora interactiva paso a paso</tspan></text>
      <text y="66"><tspan fill="#818cf8">int</tspan> <tspan fill="#60a5fa">main</tspan>() {</text>
      <text y="88">    <tspan fill="#818cf8">int</tspan> opcion, a, b;</text>
      <text y="110">    <tspan fill="#60a5fa">printf</tspan>(<tspan fill="#a5f3fc">&quot;=== CALCULADORA EN C ===\n&quot;</tspan>);</text>
      <text y="132">    <tspan fill="#60a5fa">printf</tspan>(<tspan fill="#a5f3fc">&quot;1. Sumar  2. Restar  3. Salir\n&quot;</tspan>);</text>
      <text y="154">    <tspan fill="#60a5fa">printf</tspan>(<tspan fill="#a5f3fc">&quot;Opcion: &quot;</tspan>);</text>
      <text y="176">    <tspan fill="#ec4899">if</tspan> (<tspan fill="#60a5fa">scanf</tspan>(<tspan fill="#a5f3fc">&quot;%d&quot;</tspan>, &amp;opcion) != <tspan fill="#f59e0b">1</tspan>) <tspan fill="#ec4899">return</tspan> <tspan fill="#f59e0b">0</tspan>;</text>
      <text y="198">    <tspan fill="#ec4899">switch</tspan> (opcion) {</text>
      <text y="220">        <tspan fill="#ec4899">case</tspan> <tspan fill="#f59e0b">1</tspan>:</text>
      <text y="242">            <tspan fill="#60a5fa">printf</tspan>(<tspan fill="#a5f3fc">&quot;[SUMA] Ingrese dos numeros: &quot;</tspan>);</text>
      <text y="264">            <tspan fill="#60a5fa">scanf</tspan>(<tspan fill="#a5f3fc">&quot;%d %d&quot;</tspan>, &amp;a, &amp;b);</text>

      <!-- Line 14: Highlighted Error Line with Red Background and Tooltip -->
      <rect x="-6" y="271" width="500" height="22" rx="3" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1"/>
      <text y="286">            <tspan fill="#60a5fa">printf</tspan>(<tspan fill="#a5f3fc">&quot;Resultado: %d\n&quot;</tspan>, a + b)</text>
      <!-- Tooltip -->
      <g transform="translate(310, 271)">
        <rect x="0" y="0" width="180" height="20" rx="4" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
        <text x="8" y="14" fill="#fee2e2" font-size="10.5" font-family="-apple-system,sans-serif">⚠ expected ';' before 'break'</text>
      </g>

      <text y="308">            <tspan fill="#ec4899">break</tspan>;</text>
      <text y="330">        <tspan fill="#ec4899">default</tspan>:</text>
      <text y="352">            <tspan fill="#60a5fa">printf</tspan>(<tspan fill="#a5f3fc">&quot;Saliendo...\n&quot;</tspan>);</text>
      <text y="374">    }</text>
    </g>
  </g>

