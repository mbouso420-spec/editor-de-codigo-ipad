      <text x="12" y="34" fill="#f1f5f9" font-size="11.5">y agregá la opción de resta.</text>
    </g>

    <!-- AI Response Message -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="276" height="340" rx="8" fill="#18202f" stroke="#273449" stroke-width="1"/>
      <text x="12" y="20" fill="#93c5fd" font-size="11.5" font-weight="600">Solución Quirúrgica:</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="11" line-height="1.4">Te faltaba el punto y coma en el printf</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="11">y acá tenés el case 2 para la resta:</text>

      <!-- Code Snippet Box inside Chat -->
      <rect x="10" y="66" width="256" height="218" rx="6" fill="#0b0f17" stroke="#1e2738" stroke-width="1"/>
      <g transform="translate(18, 86)" font-family="'SF Mono',Menlo,monospace" font-size="10.5">
        <text y="0" fill="#64748b">// Caso 1 corregido:</text>
        <text y="16" fill="#60a5fa">printf</text><text x="38" y="16" fill="#e2e8f0">(...);</text>
        <text y="32" fill="#ec4899">break</text><text x="32" y="32" fill="#e2e8f0">;</text>
        <text y="52" fill="#64748b">// Caso 2 resta:</text>
        <text y="68" fill="#ec4899">case</text> <text x="30" y="68" fill="#f59e0b">2</text><text x="36" y="68" fill="#e2e8f0">:</text>
        <text y="84" fill="#60a5fa">printf</text><text x="38" y="84" fill="#a5f3fc">&quot;[RESTA] Ingrese:...&quot;</text><text x="140" y="84" fill="#e2e8f0">;</text>
        <text y="100" fill="#60a5fa">scanf</text><text x="32" y="100" fill="#a5f3fc">&quot;%d %d&quot;</text><text x="80" y="100" fill="#e2e8f0">, &amp;a, &amp;b);</text>
        <text y="116" fill="#60a5fa">printf</text><text x="38" y="116" fill="#a5f3fc">&quot;Res: %d\n&quot;</text><text x="96" y="116" fill="#e2e8f0">, a - b);</text>
        <text y="132" fill="#ec4899">break</text><text x="32" y="132" fill="#e2e8f0">;</text>
      </g>

      <!-- In-Chat Action Buttons -->
