<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#0b0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow-modal-3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="primary-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Modal Shell -->
  <rect x="24" y="20" width="1152" height="720" rx="14" fill="#0f131c" stroke="#252d3d" stroke-width="1.5" filter="url(#shadow-modal-3)"/>

  <!-- Modal Header -->
  <rect x="24" y="20" width="1152" height="58" rx="14" fill="#141924"/>
  <rect x="24" y="60" width="1152" height="18" fill="#141924"/>
  <line x1="24" y1="78" x2="1176" y2="78" stroke="#232936" stroke-width="1"/>

  <text x="46" y="52" fill="#f8fafc" font-size="15" font-weight="700">Compilador C / C++ (Wandbox GCC)</text>
  <rect x="330" y="36" width="138" height="24" rx="5" fill="#1e2636" stroke="#2c374d" stroke-width="1"/>
  <text x="342" y="52" fill="#60a5fa" font-size="11.5" font-family="'SF Mono',Menlo,monospace" font-weight="600">src/calculadora.c</text>
  <rect x="478" y="36" width="106" height="24" rx="5" fill="#14281f" stroke="#059669" stroke-width="1"/>
  <circle cx="490" cy="48" r="3.5" fill="#10b981"/>
  <text x="502" y="52" fill="#34d399" font-size="11" font-weight="600">GCC 14 (C17)</text>

  <!-- Modal Top Right Actions -->
  <g transform="translate(930, 34)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#2563eb"/>
    <text x="70" y="18" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Compilar (Ctrl+Enter)</text>
    <rect x="150" y="0" width="66" height="28" rx="6" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="183" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="600">Cerrar</text>
  </g>

  <!-- ==================== BODY SPLIT: 2 PANELS ==================== -->

  <!-- LEFT PANEL: INTERACTIVE CLI TERMINAL (w: 660) -->
  <g transform="translate(44, 96)">
    <!-- Terminal Box Container -->
    <rect x="0" y="0" width="660" height="540" rx="10" fill="#080b11" stroke="#222a3a" stroke-width="1.5"/>

    <!-- Terminal Head -->
    <rect x="0" y="0" width="660" height="42" rx="10" fill="#111622"/>
    <rect x="0" y="32" width="660" height="10" fill="#111622"/>
    <line x1="0" y1="42" x2="660" y2="42" stroke="#222a3a" stroke-width="1"/>
    <circle cx="20" cy="21" r="4" fill="#10b981"/>
    <text x="34" y="26" fill="#f1f5f9" font-size="12" font-weight="600">Terminal Interactiva Paso a Paso</text>
    <rect x="520" y="10" width="124" height="22" rx="4" fill="#1e293b"/>
    <text x="582" y="25" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Paso 2 — Activo</text>

    <!-- Terminal Output Stream -->
    <g transform="translate(24, 64)" font-family="'SF Mono',Menlo,monospace" font-size="12.5" line-height="1.6">
      <!-- Step 0 Initial Menu Output -->
      <text y="0" fill="#38bdf8">=== CALCULADORA INTERACTIVA EN C ===</text>
      <text y="22" fill="#94a3b8">1. Sumar dos números</text>
      <text y="44" fill="#94a3b8">2. Restar dos números</text>
      <text y="66" fill="#94a3b8">3. Salir del programa</text>
      <text y="90" fill="#cbd5e1">Elija una opción:</text>

      <!-- Step 1 User Input -->
      <g transform="translate(0, 114)">
        <rect x="-8" y="-14" width="620" height="26" rx="4" fill="#172554"/>
        <text x="0" y="4" fill="#60a5fa" font-weight="700">&gt; 1</text>
      </g>

      <!-- Step 1 Response -->
      <text y="152" fill="#38bdf8">[SUMA] Ingrese dos números separados por espacio:</text>

      <!-- Step 2 User Input -->
      <g transform="translate(0, 176)">
        <rect x="-8" y="-14" width="620" height="26" rx="4" fill="#172554"/>
        <text x="0" y="4" fill="#60a5fa" font-weight="700">&gt; 15 25</text>
      </g>

      <!-- Step 2 Final Computation Result -->
      <text y="214" fill="#4ade80" font-weight="600">Resultado de la suma: 40</text>
      <text y="240" fill="#94a3b8">Elija una opción (o 3 para salir):</text>
    </g>

    <!-- Interactive Command Input Bar at Bottom with Arrow History -->
    <rect x="0" y="478" width="660" height="62" rx="10" fill="#111622" stroke="#222a3a" stroke-width="1"/>
    <g transform="translate(18, 492)">
      <text x="8" y="24" fill="#3b82f6" font-size="18" font-family="'SF Mono',Menlo,monospace" font-weight="700">&gt;</text>
      <!-- Text input -->
      <rect x="28" y="2" width="450" height="34" rx="6" fill="#080b11" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="40" y="23" fill="#f8fafc" font-size="13" font-family="'SF Mono',Menlo,monospace">3</text>
      <!-- Blinking Cursor -->
      <line x1="52" y1="10" x2="52" y2="28" stroke="#38bdf8" stroke-width="2"/>
      <text x="260" y="23" fill="#64748b" font-size="10.5">↑↓ Historial de sesión activo</text>

      <!-- Send Step Button -->
      <rect x="488" y="2" width="76" height="34" rx="6" fill="#2563eb"/>
      <text x="526" y="23" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Enviar</text>

      <!-- Reset Step Button -->
      <rect x="572" y="2" width="76" height="34" rx="6" fill="#1e2636" stroke="#2f3b52" stroke-width="1"/>
      <text x="610" y="23" text-anchor="middle" fill="#cbd5e1" font-size="11.5">Reiniciar</text>
    </g>
  </g>

  <!-- RIGHT PANEL: GCC SYNTAX ERROR DETECTION & INTERACTIVE JUMP (w: 430) -->
  <g transform="translate(726, 96)">
    <!-- Error Diagnostic Card -->
    <rect x="0" y="0" width="430" height="540" rx="10" fill="#131722" stroke="#222836" stroke-width="1"/>

    <!-- Diagnostic Header -->
    <rect x="0" y="0" width="430" height="42" rx="10" fill="#171d2b"/>
    <rect x="0" y="32" width="430" height="10" fill="#171d2b"/>
    <line x1="0" y1="42" x2="430" y2="42" stroke="#222836" stroke-width="1"/>
    <text x="20" y="26" fill="#f87171" font-size="12" font-weight="700">Detección de Errores de Compilación</text>

    <!-- Error Banner & Instructions -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="390" height="40" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
      <text x="14" y="18" fill="#fca5a5" font-size="11" font-weight="600">⚠ Se detectó 1 error de sintaxis en el archivo.</text>
      <text x="14" y="32" fill="#fecaca" font-size="10.5">Hacé clic en la línea roja para saltar al editor exacto:</text>
    </g>

    <!-- Clickable Error Line Item (.c-term-err-line) -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="390" height="52" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="14" y="22" fill="#fee2e2" font-size="11" font-family="'SF Mono',Menlo,monospace" font-weight="600">prog.c:14:5: error: expected ';' before 'return'</text>
      <text x="14" y="40" fill="#fca5a5" font-size="10">👆 Clic para saltar a línea 14 en CodeMirror 6</text>
    </g>

    <!-- Simulated Editor Jump Demonstration Box -->
    <g transform="translate(20, 184)">
      <text x="0" y="16" fill="#94a3b8" font-size="11" font-weight="600">Resultado en el Editor (Línea Roja + Tooltip):</text>
      
      <!-- Mini Code Area -->
      <rect x="0" y="28" width="390" height="160" rx="6" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
      
      <g transform="translate(16, 52)" font-family="'SF Mono',Menlo,monospace" font-size="11">
        <text y="0" fill="#64748b">12 |    int a, b;</text>
        <text y="20" fill="#64748b">13 |    scanf(&quot;%d %d&quot;, &amp;a, &amp;b);</text>

        <!-- Red Highlighted Error Line -->
        <rect x="-8" y="28" width="374" height="24" rx="3" fill="#ef4444" fill-opacity="0.22" stroke="#ef4444" stroke-width="1"/>
        <text y="44" fill="#f87171" font-weight="600">14 |    printf(&quot;Resultado: %d\n&quot;, a + b)</text>

        <!-- Tooltip box directly on the line -->
        <g transform="translate(120, 56)">
          <rect x="0" y="0" width="220" height="22" rx="4" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
          <text x="10" y="15" fill="#ffffff" font-size="10.5">⚠ expected ';' before 'return'</text>
        </g>

        <text y="78" fill="#64748b">15 |    return 0;</text>
        <text y="98" fill="#64748b">16 | }</text>
      </g>
    </g>

    <!-- Capabilities summary bullets -->
    <g transform="translate(20, 400)" font-size="11.5" fill="#cbd5e1" line-height="1.5">
      <text y="0" fill="#38bdf8" font-weight="600">Ventajas del nuevo Runner C/C++:</text>
      <text y="22">• Aislamiento total: no usa iframes HTML.</text>
      <text y="42">• Soporte multi-archivo con headers (.h/.hpp).</text>
      <text y="62">• Historial con flechas Arriba/Abajo en la terminal.</text>
      <text y="82">• Trunca bucles infinitos por EOF en scanf.</text>
      <text y="102">• Salto centrado y suave al código con un clic.</text>
    </g>
  </g>

</svg>
