<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#0b0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow-modal-4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Modal Shell -->
  <rect x="24" y="20" width="1152" height="720" rx="14" fill="#0f131c" stroke="#252d3d" stroke-width="1.5" filter="url(#shadow-modal-4)"/>

  <!-- Modal Header -->
  <rect x="24" y="20" width="1152" height="58" rx="14" fill="#141924"/>
  <rect x="24" y="60" width="1152" height="18" fill="#141924"/>
  <line x1="24" y1="78" x2="1176" y2="78" stroke="#232936" stroke-width="1"/>

  <text x="46" y="52" fill="#f8fafc" font-size="15" font-weight="700">Visor de Diferencias (Diff Visual) — Sugerencia de la IA</text>
  <rect x="520" y="36" width="138" height="24" rx="5" fill="#1e2636" stroke="#2c374d" stroke-width="1"/>
  <text x="532" y="52" fill="#60a5fa" font-size="11.5" font-family="'SF Mono',Menlo,monospace" font-weight="600">src/calculadora.c</text>

  <!-- Action Buttons Top Right -->
  <g transform="translate(860, 34)">
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#16a34a"/>
    <text x="90" y="18" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">✓ Aplicar cambios al archivo</text>

    <rect x="190" y="0" width="76" height="28" rx="6" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="228" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="600">Descartar</text>

    <rect x="276" y="0" width="36" height="28" rx="6" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="294" y="18" text-anchor="middle" fill="#94a3b8" font-size="13">✕</text>
  </g>

  <!-- ==================== BODY CONTENT ==================== -->

  <!-- LEFT: UNIFIED / SPLIT DIFF VIEW (w: 780) -->
  <g transform="translate(44, 96)">
    <rect x="0" y="0" width="760" height="540" rx="10" fill="#0b0f17" stroke="#1f2738" stroke-width="1"/>

    <!-- Diff Bar Header -->
    <rect x="0" y="0" width="760" height="36" rx="10" fill="#121724"/>
    <rect x="0" y="26" width="760" height="10" fill="#121724"/>
    <line x1="0" y1="36" x2="760" y2="36" stroke="#1f2738" stroke-width="1"/>
    <text x="20" y="23" fill="#94a3b8" font-size="11" font-weight="600">ORIGINAL FRENTE A SUGERENCIA IA</text>
    <rect x="620" y="8" width="124" height="20" rx="4" fill="#1e293b"/>
    <text x="682" y="22" text-anchor="middle" fill="#86efac" font-size="10.5" font-weight="600">+8 líneas / -2 líneas</text>

    <!-- Diff Code Lines -->
    <g transform="translate(0, 48)" font-family="'SF Mono',Menlo,monospace" font-size="12" line-height="1.6">
      
      <!-- Unmodified Context line 11 -->
      <g transform="translate(0, 0)">
        <text x="18" y="16" fill="#475569">11</text><text x="44" y="16" fill="#475569">11</text>
        <text x="76" y="16" fill="#94a3b8">    switch (opcion) {</text>
      </g>

      <!-- Unmodified Context line 12 -->
      <g transform="translate(0, 24)">
        <text x="18" y="16" fill="#475569">12</text><text x="44" y="16" fill="#475569">12</text>
        <text x="76" y="16" fill="#94a3b8">        case 1:</text>
      </g>

      <!-- Unmodified Context line 13 -->
      <g transform="translate(0, 48)">
        <text x="18" y="16" fill="#475569">13</text><text x="44" y="16" fill="#475569">13</text>
        <text x="76" y="16" fill="#94a3b8">            printf(&quot;[SUMA] Ingrese dos numeros: &quot;);</text>
      </g>

      <!-- DELETED LINE (RED) -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="760" height="24" fill="#7f1d1d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#f87171">14</text><text x="44" y="16" fill="#475569">  </text>
        <text x="64" y="16" fill="#ef4444" font-weight="700">-</text>
        <text x="76" y="16" fill="#fca5a5">            printf(&quot;Resultado: %d\n&quot;, a + b)</text>
      </g>

      <!-- ADDED LINE (GREEN) - FIX SYNTAX -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">14</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">            printf(&quot;Resultado de la suma: %d\n&quot;, a + b);</text>
      </g>

      <!-- ADDED LINE (GREEN) - BREAK -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">15</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">            break;</text>
      </g>

      <!-- ADDED LINE (GREEN) - CASE 2 SUBTRACTION -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">16</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">        case 2:</text>
      </g>

      <g transform="translate(0, 168)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">17</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">            printf(&quot;[RESTA] Ingrese dos numeros: &quot;);</text>
      </g>

      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">18</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">            scanf(&quot;%d %d&quot;, &amp;a, &amp;b);</text>
      </g>

      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">19</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">            printf(&quot;Resultado de la resta: %d\n&quot;, a - b);</text>
      </g>

      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="760" height="24" fill="#14532d" fill-opacity="0.32"/>
        <text x="18" y="16" fill="#475569">  </text><text x="44" y="16" fill="#4ade80">20</text>
        <text x="64" y="16" fill="#22c55e" font-weight="700">+</text>
        <text x="76" y="16" fill="#86efac">            break;</text>
      </g>

      <!-- Unmodified Context line 21 -->
      <g transform="translate(0, 264)">
        <text x="18" y="16" fill="#475569">15</text><text x="44" y="16" fill="#475569">21</text>
        <text x="76" y="16" fill="#94a3b8">        default:</text>
      </g>

      <g transform="translate(0, 288)">
        <text x="18" y="16" fill="#475569">16</text><text x="44" y="16" fill="#475569">22</text>
        <text x="76" y="16" fill="#94a3b8">            printf(&quot;Opcion no valida.\n&quot;);</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: EXPLANATION CARD (w: 330) -->
  <g transform="translate(824, 96)">
    <rect x="0" y="0" width="330" height="540" rx="10" fill="#131722" stroke="#222836" stroke-width="1"/>

    <!-- Header -->
    <rect x="0" y="0" width="330" height="42" rx="10" fill="#171d2b"/>
    <rect x="0" y="32" width="330" height="10" fill="#171d2b"/>
    <line x1="0" y1="42" x2="330" y2="42" stroke="#222836" stroke-width="1"/>
    <text x="18" y="26" fill="#f8fafc" font-size="12" font-weight="700">Inyección Quirúrgica de Código</text>

    <g transform="translate(18, 58)" font-size="11.5" fill="#cbd5e1" line-height="1.5">
      <text y="14" fill="#38bdf8" font-weight="600">Reemplazo Atómico Total:</text>
      <text y="34">Al tocar &quot;Aplicar cambios&quot; o &quot;Reemplazar&quot;,</text>
      <text y="52">CodeMirror 6 reemplaza el rango completo</text>
      <text y="70" font-family="'SF Mono',Menlo,monospace" fill="#93c5fd">0 a doc.length</text>
      <text y="90">Evita que la IA escriba encima o duplique</text>
      <text y="108">código al final del archivo existente.</text>

      <line x1="0" y1="130" x2="294" y2="130" stroke="#222836" stroke-width="1"/>

      <text y="156" fill="#a855f7" font-weight="600">Presupuesto Inteligente de IA:</text>
      <text y="176">• Truncamiento automático a 12.000 car.</text>
      <text y="194">• Preserva cabecera y pie con aviso.</text>
      <text y="212">• Estimador de tokens en tiempo real.</text>
      <text y="230">• Prevención de errores HTTP 413 / 429.</text>

      <line x1="0" y1="250" x2="294" y2="250" stroke="#222836" stroke-width="1"/>

      <text y="276" fill="#10b981" font-weight="600">Modelos Gratuitos Soportados:</text>
      <text y="296">• Google Gemini 2.0 Flash</text>
      <text y="314">• Groq (Llama 3.3 70B Versatile)</text>
      <text y="332">• OpenRouter Free Models</text>
      <text y="350">• Mistral La Plateforme</text>
    </g>
  </g>

</svg>
