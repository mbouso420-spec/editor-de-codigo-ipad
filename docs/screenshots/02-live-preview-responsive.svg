<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#0b0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow-modal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="blue-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Modal Shell -->
  <rect x="24" y="20" width="1152" height="720" rx="14" fill="#0f131c" stroke="#252d3d" stroke-width="1.5" filter="url(#shadow-modal)"/>

  <!-- Modal Header & Toolbar -->
  <rect x="24" y="20" width="1152" height="58" rx="14" fill="#141924"/>
  <rect x="24" y="60" width="1152" height="18" fill="#141924"/>
  <line x1="24" y1="78" x2="1176" y2="78" stroke="#232936" stroke-width="1"/>

  <!-- Modal Title & Page Badge -->
  <text x="46" y="52" fill="#f8fafc" font-size="15" font-weight="700">Vista previa de HTML</text>
  <rect x="206" y="36" width="132" height="24" rx="5" fill="#1e2636" stroke="#2c374d" stroke-width="1"/>
  <text x="218" y="52" fill="#60a5fa" font-size="11.5" font-family="'SF Mono',Menlo,monospace" font-weight="600">catalogo.html</text>

  <!-- Multi-page navigation (Back, Forward, Page Selector) -->
  <g transform="translate(352, 34)">
    <rect x="0" y="0" width="28" height="28" rx="5" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="14" y="18" text-anchor="middle" fill="#cbd5e1" font-size="12">◀</text>

    <rect x="34" y="0" width="28" height="28" rx="5" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="48" y="18" text-anchor="middle" fill="#cbd5e1" font-size="12">▶</text>

    <!-- Page Selector Dropdown -->
    <rect x="70" y="0" width="190" height="28" rx="5" fill="#1a212e" stroke="#3b82f6" stroke-width="1"/>
    <text x="82" y="18" fill="#f8fafc" font-size="12">📄 catalogo.html (recordado)</text>
    <text x="244" y="18" fill="#94a3b8" font-size="10">▼</text>
  </g>

  <!-- Device Switcher Controls (Mobile, Tablet, Desktop) -->
  <g transform="translate(680, 34)">
    <rect x="0" y="0" width="88" height="28" rx="5" fill="#161c27" stroke="#263042" stroke-width="1"/>
    <text x="44" y="18" text-anchor="middle" fill="#94a3b8" font-size="11.5">Móvil (390)</text>

    <!-- Tablet / iPad (Active) -->
    <rect x="94" y="0" width="96" height="28" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="142" y="18" text-anchor="middle" fill="#60a5fa" font-size="11.5" font-weight="600">Tablet (820px)</text>

    <rect x="196" y="0" width="102" height="28" rx="5" fill="#161c27" stroke="#263042" stroke-width="1"/>
    <text x="247" y="18" text-anchor="middle" fill="#94a3b8" font-size="11.5">Escritorio (100%)</text>
  </g>

  <!-- Close / Reload Buttons -->
  <g transform="translate(1050, 34)">
    <rect x="0" y="0" width="36" height="28" rx="5" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="18" y="18" text-anchor="middle" fill="#cbd5e1" font-size="13">⟳</text>

    <rect x="44" y="0" width="66" height="28" rx="5" fill="#1a212e" stroke="#2c374d" stroke-width="1"/>
    <text x="77" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="600">Cerrar</text>
  </g>

  <!-- ==================== PREVIEW STAGE AREA ==================== -->
  <rect x="24" y="78" width="1152" height="500" fill="#080b11"/>

  <!-- Simulated Tablet Viewport Container (Centered, 820px width) -->
  <g transform="translate(190, 96)">
    <!-- Simulated iPad Screen Bezel -->
    <rect x="0" y="0" width="820" height="462" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#shadow-modal)"/>

    <!-- Web App Navbar inside Preview -->
    <rect x="0" y="0" width="820" height="56" rx="10" fill="#0f172a"/>
    <rect x="0" y="46" width="820" height="10" fill="#0f172a"/>
    <text x="32" y="36" fill="#38bdf8" font-size="18" font-weight="800" letter-spacing="-0.5">ROPA URBANA</text>
    <text x="210" y="34" fill="#cbd5e1" font-size="13" font-weight="500">Inicio</text>
    <text x="270" y="34" fill="#38bdf8" font-size="13" font-weight="700">Catálogo</text>
    <line x1="270" y1="42" x2="330" y2="42" stroke="#38bdf8" stroke-width="2"/>
    <text x="350" y="34" fill="#cbd5e1" font-size="13" font-weight="500">Contacto</text>

    <!-- Search bar & Cart pill inside preview -->
    <rect x="560" y="14" width="160" height="28" rx="14" fill="#1e293b"/>
    <text x="580" y="32" fill="#64748b" font-size="11.5">Buscar productos...</text>
    <rect x="736" y="14" width="56" height="28" rx="6" fill="#2563eb"/>
    <text x="764" y="32" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Carrito (2)</text>

    <!-- Catalog Content inside Preview -->
    <text x="32" y="94" fill="#0f172a" font-size="20" font-weight="700">Catálogo de Temporada</text>
    <text x="32" y="114" fill="#64748b" font-size="13">Prendas seleccionadas con entrega inmediata en todo el país.</text>

    <!-- Product Cards Grid (3 cards) -->
    <!-- Card 1 -->
    <g transform="translate(32, 134)">
      <rect x="0" y="0" width="234" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="210" height="150" rx="6" fill="#e2e8f0"/>
      <text x="117" y="92" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">[ Remera Oversize ]</text>
      <text x="16" y="184" fill="#0f172a" font-size="14" font-weight="700">Remera Oversize Acid</text>
      <text x="16" y="204" fill="#64748b" font-size="12">100% Algodón Peinado</text>
      <text x="16" y="238" fill="#0f172a" font-size="16" font-weight="800">$24.500</text>
      <rect x="120" y="218" width="102" height="30" rx="6" fill="#0f172a"/>
      <text x="171" y="238" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Agregar</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(292, 134)">
      <rect x="0" y="0" width="234" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="210" height="150" rx="6" fill="#cbd5e1"/>
      <text x="117" y="92" text-anchor="middle" fill="#64748b" font-size="13" font-weight="600">[ Buzo Hoodie Black ]</text>
      <text x="16" y="184" fill="#0f172a" font-size="14" font-weight="700">Buzo Hoodie Heavy</text>
      <text x="16" y="204" fill="#64748b" font-size="12">Frisa premium unisex</text>
      <text x="16" y="238" fill="#0f172a" font-size="16" font-weight="800">$48.000</text>
      <rect x="120" y="218" width="102" height="30" rx="6" fill="#0f172a"/>
      <text x="171" y="238" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Agregar</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(552, 134)">
      <rect x="0" y="0" width="234" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="210" height="150" rx="6" fill="#e2e8f0"/>
      <text x="117" y="92" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">[ Pantalón Cargo ]</text>
      <text x="16" y="184" fill="#0f172a" font-size="14" font-weight="700">Pantalón Cargo Ripstop</text>
      <text x="16" y="204" fill="#64748b" font-size="12">Corte relajado con 6 bolsillos</text>
      <text x="16" y="238" fill="#0f172a" font-size="16" font-weight="800">$52.000</text>
      <rect x="120" y="218" width="102" height="30" rx="6" fill="#0f172a"/>
      <text x="171" y="238" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Agregar</text>
    </g>
  </g>

  <!-- ==================== CONSOLE DRAWER AT BOTTOM ==================== -->
  <g transform="translate(24, 578)">
    <rect x="0" y="0" width="1152" height="162" rx="0" fill="#0d1117" stroke="#232936" stroke-width="1"/>
    
    <!-- Console Bar -->
    <rect x="0" y="0" width="1152" height="32" fill="#131822"/>
    <line x1="0" y1="32" x2="1152" y2="32" stroke="#232936" stroke-width="1"/>
    <text x="24" y="21" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.5">CONSOLA JAVASCRIPT</text>
    <rect x="174" y="7" width="56" height="18" rx="4" fill="#1e293b"/>
    <text x="202" y="20" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">2 logs</text>

    <!-- Console lines -->
    <g transform="translate(24, 46)" font-family="'SF Mono',Menlo,monospace" font-size="11.5">
      <text y="14"><tspan fill="#38bdf8">[info]</tspan> <tspan fill="#e2e8f0">Aplicación web 'catalogo.html' montada exitosamente en el DOM.</tspan></text>
      <text y="38"><tspan fill="#10b981">[log]</tspan>  <tspan fill="#e2e8f0">Hojas de estilo 'styles.css' vinculadas e inyectadas dinámicamente.</tspan></text>
      <text y="62"><tspan fill="#a855f7">[nav]</tspan>  <tspan fill="#94a3b8">Preferencia de proyecto guardada: studio_preview_last_html:tienda-demo -&gt; catalogo.html</tspan></text>
      <text y="88" fill="#64748b">&gt; _</text>
    </g>
  </g>

</svg>
